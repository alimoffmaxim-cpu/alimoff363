<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Страница не содержит данных. Цифры передаёт бот во фрагменте ссылки (#d.…),
    который браузер не отправляет на сервер. CSP запрещает странице любые сетевые
    запросы и чужие скрипты — кроме официального скрипта Telegram.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self';
                 img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Финансы</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

  </main>
</body>
</html>
